name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment at a time, and don't cancel one halfway through
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v5

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.4"

      - run: mix deps.get
      - run: mix docs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: doc

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
